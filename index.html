<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>APS 인덱스 · 티켓 회원</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font:15px/1.6 system-ui,'Apple SD Gothic Neo',sans-serif}header{background:#10233d;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:22px}header a{color:#d6e8ff;text-decoration:none}.wrap{max-width:980px;margin:34px auto;padding:0 18px}.hero{background:linear-gradient(115deg,#102c48,#146a85);color:#fff;padding:32px;border-radius:20px;margin-bottom:20px}.hero h1{margin:4px 0;font-size:29px}.hero p{opacity:.8;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:white;border:1px solid #e1e8f0;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 4px 14px #182c4610}.metric{font-size:36px;font-weight:800;margin:8px 0;color:#0a7186}.muted{color:#64748b;font-size:13px}h2{font-size:19px;margin:0 0 15px}label{display:block;margin:12px 0 5px;font-weight:600}input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;background:white}button{cursor:pointer;border:0;border-radius:10px;background:#0d748b;color:white;font:inherit;font-weight:700;padding:12px 20px;margin-top:12px}button.secondary{background:#e7eff6;color:#17243b}button:disabled{opacity:.45;cursor:not-allowed}.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.flex>*{flex:1}.alert{padding:12px;background:#e8f4fa;border-radius:10px;color:#14576b;margin:14px 0}.error{background:#fff0ed;color:#ac342c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{margin:0}.tabs button.off{background:#e7edf5;color:#22364f}.list{padding:0;margin:0;list-style:none}.list li{border-bottom:1px solid #e5ebf2;padding:12px 0}.pill{display:inline-block;padding:3px 8px;background:#eef3f7;border-radius:20px;font-size:12px}small{color:#6e8296}footer{text-align:center;color:#8190a0;margin:35px 0;font-size:12px}@media(max-width:600px){.hero{padding:23px}.hero h1{font-size:23px}}</style></head><body><header><b>APS <span style="color:#55cad2">POINT</span></b><a href="admin.html">관리자 페이지 →</a></header><main class="wrap"><div id="msg"></div><div id="app"></div><footer>APS 포인트 체험판 · 브라우저별 데이터 저장 · 실제 티켓 지급 기능 없음</footer></main><script>const KEY='aps-index-ticket-demo-v1',RATE=40;const examples=[{id:'U-1024',name:'김서연',phone:'010-2481-1024',ip:120,fp:'FP-20481'},{id:'U-1025',name:'박도윤',phone:'010-3917-1025',ip:40,fp:'FP-30917'},{id:'U-1026',name:'이하은',phone:'010-5530-1026',ip:0,fp:'FP-55302'},{id:'U-1027',name:'최민준',phone:'010-7042-1027',ip:80,fp:''}];function initial(){return{users:examples.map(x=>({...x})),logs:[],requests:[],seq:1}}function read(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.users)&&Array.isArray(d.logs))return d}catch{}return initial()}let db=read();db.requests??=[];db.settings??={ratio:40,max:5,opened:true};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('ko-KR');function save(){localStorage.setItem(KEY,JSON.stringify(db))}function log(type,id,qty,memo){db.logs.unshift({no:'APS-'+String(db.seq++).padStart(5,'0'),type,id,qty,memo,date:new Date().toLocaleString('ko-KR')});save()}function msg(t,bad=false){document.getElementById('msg').innerHTML='<div class="alert '+(bad?'error':'')+'">'+esc(t)+'</div>'}function user(id){return db.users.find(x=>x.id===id)}function recent(id){return db.logs.filter(x=>!id||x.id===id).slice(0,30).map(l=>'<li><b>'+esc(l.type)+'</b> · '+esc(user(l.id)?.name||l.id)+' <span class="pill">'+(l.qty>0?'+':'')+fmt(l.qty)+' IP</span><div class="muted">'+esc(l.date)+' · '+esc(l.memo)+' · '+esc(l.no)+'</div></li>').join('')||'<li class="muted">내역이 없습니다.</li>'}
let uid=sessionStorage.getItem('aps-member')||'';function view(){let m=user(uid),el=document.getElementById('app');if(!m){el.innerHTML='<div class="card"><h2>회원 로그인</h2><p class="muted">체험판입니다. 이름과 휴대폰 번호로 로그인합니다.</p><label>이름</label><input id="name" placeholder="이름"><label>휴대폰 번호</label><input id="phone" placeholder="010-0000-0000"><button onclick="login()">로그인</button><button class="secondary" onclick="quickLogin()">체험 회원 자동 로그인</button><p class="muted">체험 회원: 김서연 / 010-2481-1024</p></div>';return}el.innerHTML='<div class="hero"><p>APS 포인트 서비스</p><h1>'+esc(m.name)+'님의 포인트</h1><p>인덱스포인트와 풀팟 티켓</p></div><div class="grid"><div class="card"><div>보유 인덱스포인트</div><div class="metric">'+fmt(m.ip)+' <small>IP</small></div></div><div class="card"><div>교환 가능한 풀팟 티켓</div><div class="metric">'+fmt(Math.floor((m.ip-(m.held||0))/(db.settings.ratio||RATE)))+' <small>장</small></div><div class="muted">'+(db.settings.ratio||RATE)+' IP = 티켓 1장</div></div></div><div class="card"><h2>풀팟 티켓 교환</h2><label>풀팟 ID</label><input id="fp" value="'+esc(m.fp)+'" placeholder="풀팟 계정 ID"><label>티켓 장수</label><input id="qty" type="number" min="1" max="'+Math.floor((m.ip-(m.held||0))/(db.settings.ratio||RATE))+'" value="1"><p class="muted">교환 시 장당 '+(db.settings.ratio||RATE)+' IP 사용 대기 · 실제 게임 지급 연동 없음</p><button onclick="exchange()" '+(m.ip-(m.held||0)<(db.settings.ratio||RATE)?'disabled':'')+'>티켓 교환 신청</button></div><div class="card"><h2>내역</h2><ul class="list">'+recent(uid)+'</ul></div><button class="secondary" onclick="logout()">로그아웃</button>'}function login(){let n=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.replace(/\D/g,'');let m=db.users.find(x=>x.name===n&&x.phone.replace(/\D/g,'')===p);if(!m){msg('일치하는 체험 회원이 없습니다.',true);return}uid=m.id;sessionStorage.setItem('aps-member',uid);msg('로그인했습니다.');view()}function quickLogin(){const m=db.users.find(x=>x.id==='U-1024')||db.users[0];if(!m){msg('체험 회원이 없습니다.',true);return}uid=m.id;sessionStorage.setItem('aps-member',uid);msg('체험 회원으로 로그인했습니다.');view()}function logout(){uid='';sessionStorage.removeItem('aps-member');msg('로그아웃했습니다.');view()}function exchange(){let m=user(uid),n=Number(document.getElementById('qty').value),fp=document.getElementById('fp').value.trim(),ratio=db.settings.ratio||RATE,cost=n*ratio;if(db.settings.opened===false){msg('현재 교환 신청이 닫혀 있습니다.',true);return}if(!Number.isInteger(n)||n<1||n>(db.settings.max||5)||cost>m.ip-(m.held||0)){msg('사용 가능한 포인트 내에서 수량을 선택하세요.',true);return}if(!fp){msg('풀팟 ID를 입력하세요.',true);return}if(!confirm(n+'장 교환 신청 시 '+cost+' IP가 사용 대기로 전환됩니다. 진행할까요?'))return;m.fp=fp;m.held=(m.held||0)+cost;const no='REQ-'+String(db.seq++).padStart(5,'0');db.requests.push({no,id:uid,qty:n,fp,cost,status:'확인 필요',date:new Date().toLocaleString('ko-KR')});log('티켓 교환 신청',uid,0,fp+' · '+n+'장 · '+cost+' IP 사용 대기');msg('교환 신청이 접수되었습니다. 실제 지급은 별도 서버 연동이 필요합니다.');view()}view()</script></body></html>
