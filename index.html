<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APS LOUNGE 내 포인트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F7;--surface:#FFFFFF;--surface2:#F6F9FB;--ink:#14243A;--ink2:#56697D;--ink3:#8797A8;--line:#D9E2EA;
  --navy:#13233A;--navy-ink:#FFFFFF;--navy-ink2:#9DB0C4;--teal:#157C9B;--teal-ink:#FFFFFF;--teal-soft:#E2F0F4;--teal-text:#11677F;
  --ok:#1D7F55;--ok-soft:#E3F3EB;--warn:#9A6417;--warn-soft:#FCF3E2;--bad:#B23E37;--bad-soft:#FBE9E7;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1722;--surface:#15212E;--surface2:#1A2836;--ink:#E5ECF3;--ink2:#A3B3C3;--ink3:#73869A;--line:#293A4C;
  --navy:#091320;--navy-ink:#F1F5F9;--navy-ink2:#8EA2B7;--teal:#3AA7C7;--teal-ink:#06202A;--teal-soft:#123241;--teal-text:#7CCBE2;
  --ok:#5BC491;--ok-soft:#133126;--warn:#E7B45F;--warn-soft:#352812;--bad:#F07F76;--bad-soft:#3A1A18;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1722;--surface:#15212E;--surface2:#1A2836;--ink:#E5ECF3;--ink2:#A3B3C3;--ink3:#73869A;--line:#293A4C;
  --navy:#091320;--navy-ink:#F1F5F9;--navy-ink2:#8EA2B7;--teal:#3AA7C7;--teal-ink:#06202A;--teal-soft:#123241;--teal-text:#7CCBE2;
  --ok:#5BC491;--ok-soft:#133126;--warn:#E7B45F;--warn-soft:#352812;--bad:#F07F76;--bad-soft:#3A1A18;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.top-in{display:flex;align-items:center;gap:20px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:8px}
.brand b{font-size:20px;font-weight:800;letter-spacing:.02em}
.brand small{font-size:11px;color:var(--navy-ink2);margin-top:3px}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:transparent;color:var(--navy-ink2);padding:7px 13px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy);font-weight:700}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--navy-ink2)}
.top-tools select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--navy-ink);border-radius:7px;padding:5px 8px;font-size:13px}
.top-tools select option{color:#14243A}
.top-tools .ghost{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--navy-ink);border-radius:7px;padding:5px 10px;font-size:13px}

/* admin layout */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{min-width:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side h2{font-size:12px;color:var(--ink3);font-weight:700;margin:0 10px 10px;letter-spacing:.04em}
.side nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font-size:15px;color:var(--ink2)}
.side nav button[aria-current="page"]{background:var(--teal-soft);color:var(--teal-text);font-weight:700}
.side .badge{background:var(--warn);color:var(--surface);font-size:11px;border-radius:99px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:12px 10px 0;border-top:1px solid var(--line)}
.side-foot label{display:block;margin-bottom:6px;color:var(--ink2);font-weight:500}
.side-foot select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);margin-bottom:8px}
.main{padding:28px 32px 60px;min-width:0}
.ph{margin-bottom:22px}
.ph .k{font-size:13px;color:var(--teal-text);font-weight:700;margin:0 0 4px}
.ph h1{font-size:28px;line-height:1.25;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.ph p{margin:0;color:var(--ink2);max-width:70ch}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.panel h3{font-size:17px;margin:0 0 14px;font-weight:700}
.panel h3 small{font-weight:400;color:var(--ink3);font-size:13px;margin-left:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2>.panel{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat span{display:block;font-size:13px;color:var(--ink2)}
.stat b{display:block;font-size:24px;font-weight:800;margin-top:4px}
.stat b small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:3px}
.stat.hl{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.stat.hl span,.stat.hl b small{color:var(--navy-ink2)}
.stat.warn{background:var(--warn-soft);border-color:transparent}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink3);margin-top:5px}
.bigin{display:flex;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:6px 14px;background:var(--surface)}
.bigin input{border:0;background:transparent;text-align:right;font-size:28px;font-weight:800;width:100%;padding:4px 8px;outline:none}
.bigin:focus-within{outline:2px solid var(--teal);outline-offset:1px}
.bigin em{font-style:normal;font-weight:700;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-text);background:var(--teal-soft);font-weight:700}
.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:700;background:var(--teal);color:var(--teal-ink);font-size:15px}
.btn.block{width:100%;padding:14px}
.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--teal-soft);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.who b{font-size:18px}
.who .meta{font-size:13px;color:var(--ink2)}
.who .amt{text-align:right}
.who .amt b{font-size:20px}

dl.sum{margin:0}
dl.sum div{display:flex;justify-content:space-between;gap:12px;padding:7px 0}
dl.sum dt{color:var(--ink2)}
dl.sum dd{margin:0;font-weight:700;text-align:right}
dl.sum hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{border-radius:10px;padding:11px 14px;font-size:13px;margin:12px 0}
.note.info{background:var(--teal-soft);color:var(--teal-text)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin:12px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--teal);width:16px;height:16px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{background:var(--surface2);text-align:left;font-weight:700;color:var(--ink2);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.off td{color:var(--ink3)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--teal-soft);color:var(--teal-text)}
.tag.mute{background:var(--surface2);color:var(--ink3);border:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:14px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.seg label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.seg input{accent-color:var(--teal);margin-right:6px}
.seg small{display:block;color:var(--ink2);font-size:12px;margin-top:2px;padding-left:22px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700}
.stepper input{width:90px;text-align:center;font-size:20px;font-weight:800;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--surface)}

/* member */
.mwrap{display:flex;justify-content:center;padding:28px 16px 60px}
.phone{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;min-height:720px;background:var(--surface2)}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.ptop b{font-size:18px;font-weight:800}
.ptop button{border:0;background:none;color:var(--ink2);font-size:13px}
.pbody{flex:1;padding:22px 20px;overflow:auto}
.pbody h1{font-size:23px;margin:0 0 4px;font-weight:800;line-height:1.3}
.pbody .sub{color:var(--ink2);font-size:14px;margin:0 0 18px}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.ptabs button{border:0;background:none;padding:14px 4px;font-size:13px;color:var(--ink3)}
.ptabs button[aria-current="page"]{color:var(--teal-text);font-weight:700}
.wallet{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:20px 22px;margin-bottom:12px}
.wallet span{font-size:13px;color:var(--navy-ink2)}
.wallet .big{font-size:38px;font-weight:800;line-height:1.15;margin:6px 0 12px}
.wallet .big small{font-size:18px;margin-left:6px}
.wallet ul{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid rgba(255,255,255,.16);font-size:14px}
.wallet li{display:flex;justify-content:space-between;padding:4px 0}
.wallet li em{font-style:normal;color:var(--navy-ink2);font-size:12px;margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card .lbl{font-size:13px;color:var(--ink2)}
.card .v{font-size:26px;font-weight:800}
.card .v small{font-size:15px;margin-left:4px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list .t{font-size:12px;color:var(--ink3)}
.list li>b{white-space:nowrap;flex-shrink:0}

/* overview */
.ov{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
.ov-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:36px}
.ov-hero h1{font-size:44px;line-height:1.15;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.ov-hero p{color:var(--ink2);font-size:16px;margin:0;max-width:52ch}
.flow{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:22px}
.flow .lane{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
.flow .lane:last-child{border-bottom:0}
.flow .pill{background:rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}
.flow .pill.t{background:var(--teal);color:var(--teal-ink)}
.flow .arr{color:var(--navy-ink2)}
.roles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:36px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column}
.role h3{margin:0 0 6px;font-size:18px}
.role p{margin:0 0 14px;color:var(--ink2);font-size:14px;flex:1}
.ov h2{font-size:21px;margin:36px 0 12px;font-weight:800}
.ov .lead{color:var(--ink2);margin:-6px 0 14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;counter-reset:s}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--ink2);counter-increment:s}
.steps li b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.steps li b::before{content:counter(s) ". ";color:var(--teal-text)}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(8,16,26,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:440px;border:1px solid var(--line)}
.modal h3{margin:0 0 10px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad)}
.login{display:flex;justify-content:center;padding:56px 16px}
.lbox{width:100%;max-width:420px;padding:28px}
.lbox h1{font-size:26px;margin:0 0 4px;font-weight:800}
.lbox .k{font-size:13px;color:var(--teal-text);font-weight:700;margin:0 0 6px}
.lbox .sub{color:var(--ink2);margin:0 0 20px;font-size:14px}
.lbox .hint{font-size:12px;color:var(--ink3);margin-top:10px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.res button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4}
.res button b{display:block;font-size:15px}
.res button span{color:var(--ink3);font-size:12px}
.res button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.res-h{font-size:12px;color:var(--ink3);margin-top:12px}
.me{font-size:13px;color:var(--ink2);margin-bottom:10px}
.me b{display:block;color:var(--ink);font-size:15px}
.foot{font-size:12px;color:var(--ink3);text-align:center;padding:16px}

@media (max-width:900px){
  .admin{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .side h2{display:none}
  .side nav{display:flex;gap:4px;overflow-x:auto}
  .side nav button{white-space:nowrap;width:auto}
  .side-foot{border-top:0;padding:8px 4px 0;display:flex;gap:8px;align-items:center}
  .side-foot label{margin:0;white-space:nowrap}
  .side-foot select{margin:0;width:auto}
  .side-foot .me{margin:0;flex:1}.side-foot .me b{display:inline;margin-right:6px}
  .main{padding:20px 16px 50px}
  .grid2,.ov-hero,.roles3{grid-template-columns:1fr}
  .ov-hero h1{font-size:34px}
  .top-in{padding:10px 14px;gap:10px}
  .top-tools{margin-left:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>APS LOUNGE</b><small>Powered by 풀팟홀덤</small></div>
  
</div></header>
<div id="app"></div>
<p class="foot">체험판 · 회원, 매장, 수량, 거래번호는 예시입니다. 교환 비율은 확정 전 예시입니다.</p>

<script>
const KEY='aps-lounge-demo-v3';
const STORES=[
  {id:'L01',name:'강남점',type:'lounge'},
  {id:'L02',name:'잠실점',type:'lounge'},

];

  {id:'aps_seomyeon',pw:'partner1234',type:'partner',store:'P02'}
];
const MEMBERS=[
  {id:'U-1024',name:'김서연',nick:'서연짱',phone:'010-2481-1024',fp:{id:'FP-20481',nick:'리버킹'}},
  {id:'U-1025',name:'박도윤',nick:'도윤',phone:'010-3917-1025',fp:{id:'FP-30917',nick:'도윤올인'}},
  {id:'U-1026',name:'이하은',nick:'하은이',phone:'010-5530-1026',fp:{id:'FP-55302',nick:'하은스트레이트'}},
  {id:'U-1027',name:'최민준',nick:'민준킹',phone:'010-7042-1027',fp:null}
];
const FP_DIR={'FP-20481':'리버킹','FP-30917':'도윤올인','FP-55302':'하은스트레이트','FP-70421':'민준플러시','FP-11111':'테스트유저'};
const TYPE={
  LP_GRANT:'LP 지급',LP_RECALL:'LP 회수',LP_EXCH_IP:'LP → 인덱스 교환',IP_EARN:'IP 적립(교환)',
  LP_HOLD:'LP 예약(티켓)',LP_EXCH_TK:'LP → 티켓 확정',LP_RELEASE:'예약 해제',IP_GRANT:'IP 지급',IP_CORRECT:'IP 본사 정정'

function now(){return Date.now()}
function addTx(o,at){const no='T'+(++S.seq.tx);S.ledger.push({no,ts:at||now(),ver:pol().ver,...o});return no}
const lotsOf=(m,s)=>S.lots.filter(l=>l.m===m&&l.s===s);
const availLP=(m,s)=>lotsOf(m,s).reduce((a,l)=>a+l.left,0);
const heldLP=(m,s)=>lotsOf(m,s).reduce((a,l)=>a+l.held,0);
const ipOf=m=>S.ip[m]||0;

function grantLP(m,s,amt,reason,actor,memo,at){
  amt=Math.floor(Number(amt));
  if(!(amt>0))throw '지급 포인트는 1 이상 정수로 입력합니다.';
  if(!reason)throw '지급 사유를 입력합니다.';
  if(store(s).type!=='lounge')throw '라운지 매장만 라운지포인트를 지급할 수 있습니다.';
  if(amt>S.limits[s])throw `1회 지급 한도(${fmt(S.limits[s])} LP)를 넘습니다. 본사 설정 한도입니다.`;
  const no=addTx({type:'LP_GRANT',m,s,actor,lp:amt,reason,memo},at);
  S.lots.push({tx:no,m,s,amt,left:amt,held:0,ts:at||now()});
  return no;
}
function recallLP(lotTx,amt,reason,actor,scope){
  const lot=S.lots.find(l=>l.tx===lotTx);
  if(!lot)throw '원지급 거래를 선택합니다.';
  if(scope&&lot.s!==scope)throw '다른 매장 지급분은 회수할 수 없습니다.';
  amt=Math.floor(Number(amt));
  if(!(amt>0))throw '회수 포인트는 1 이상 정수로 입력합니다.';
  if(!reason)throw '회수 사유를 입력합니다.';
  if(amt>lot.left)throw `회수 가능 수량(${fmt(lot.left)} LP)을 넘습니다. 교환 완료·예약분은 회수할 수 없습니다.`;
  lot.left-=amt;
  return addTx({type:'LP_RECALL',m:lot.m,s:lot.s,actor,lp:-amt,reason,ref:lotTx});
}
function allocate(m,s,need){
  const out=[];let r=need;
  for(const l of lotsOf(m,s).sort((a,b)=>a.ts-b.ts)){if(!r)break;const t=Math.min(l.left,r);if(t>0){l.left-=t;l.held+=t;out.push([l.tx,t]);r-=t}}
  return out;
}
function exchange({m,s,target,qty,by,actor,confirm,at}){
  const p=pol();qty=Math.floor(Number(qty));
  if(!(qty>0))throw '교환 수량을 선택합니다.';
  if(!confirm)throw '교환 대상과 수량 확인에 체크합니다.';
  const lp=target==='IP'?qty*p.lpPerIp:qty*p.lpPerTicket;
  const mem=member(m);
  if(target==='TK'){
    if(!mem.fp)throw '풀팟 계정을 먼저 연결합니다.';
    if(qty>p.maxTickets)throw `티켓은 1회 최대 ${p.maxTickets}장까지 신청합니다.`;
  }
  const av=availLP(m,s);
  if(lp>av)throw `${store(s).name} 사용 가능 잔액이 ${fmt(lp-av)} LP 부족합니다.`;
  const no='X'+(++S.seq.ex);
  const alloc=allocate(m,s,lp);
  const ex={no,m,s,target,qty,lp,by,actor,ver:p.ver,ts:at||now(),alloc,status:'접수',fp:mem.fp?{...mem.fp}:null,autoAt:at?null:now()+30000};
  S.ex.push(ex);
  if(target==='IP'){
    settleAlloc(ex);S.ip[m]=ipOf(m)+qty;
    addTx({type:'LP_EXCH_IP',m,s,actor,lp:-lp,ref:no,reason:by},at);
    addTx({type:'IP_EARN',m,s,actor,ip:qty,ref:no,reason:by},at);
    ex.status='완료';
  }else{
    addTx({type:'LP_HOLD',m,s,actor,hold:lp,ref:no,reason:by},at);
    const mode=S.fp;
    if(mode==='ok'){completeTicket(ex,'FPG-'+pad(Math.floor(Math.random()*90000)+10000,5),'풀팟 응답',at)}
    else if(mode==='delay'){ex.status='확인 중';ex.delivered=true;ex.tries=1;ex.lastCheck=at||now()}
    else{failTicket(ex,'풀팟에서 지급을 거절했습니다(모의: 계정 상태 확인 필요).','풀팟 응답',at)}
  }
  return ex;
}
function settleAlloc(ex){for(const[tx,t]of ex.alloc){const l=S.lots.find(x=>x.tx===tx);l.held-=t}}
function releaseAlloc(ex){for(const[tx,t]of ex.alloc){const l=S.lots.find(x=>x.tx===tx);l.held-=t;l.left+=t}}
function completeTicket(ex,payNo,actor,at){
  settleAlloc(ex);ex.status='완료';ex.payNo=payNo;ex.doneBy=actor;ex.doneAt=at||now();
  addTx({type:'LP_EXCH_TK',m:ex.m,s:ex.s,actor,lp:-ex.lp,ref:ex.no,reason:`티켓 ${ex.qty}장 · 지급번호 ${payNo}`},at);
}
function failTicket(ex,reason,actor,at){
  releaseAlloc(ex);ex.status='실패';ex.reason=reason;ex.doneBy=actor;ex.doneAt=at||now();
  addTx({type:'LP_RELEASE',m:ex.m,s:ex.s,actor,hold:-ex.lp,ref:ex.no,reason},at);
}
function grantIP(m,s,amt,reason,actor){
  if(String(amt).trim().startsWith('-'))throw '음수는 입력할 수 없습니다. 제휴매장은 인덱스를 회수할 수 없습니다.';
  amt=Math.floor(Number(amt));
  if(!(amt>0))throw '지급 포인트는 1 이상 정수로 입력합니다.';
  if(!reason)throw '지급 사유를 입력합니다.';
  if(store(s).type!=='partner')throw '제휴매장 계정만 인덱스를 직접 지급합니다.';
  if(amt>S.limits[s])throw `1회 지급 한도(${fmt(S.limits[s])} IP)를 넘습니다.`;
  S.ip[m]=ipOf(m)+amt;
  return addTx({type:'IP_GRANT',m,s,actor,ip:amt,reason});
}

function resultCard(e,member){

    case 'lgrant':{const f=U.lg;b.disabled=true;act(()=>grantLP(U.sel.lounge,sidL,f.amt,f.reason.trim(),actL,f.memo.trim()),r=>`${r} 지급을 완료했습니다.`);break}
    case 'lrecall':{const f=U.lr;b.disabled=true;act(()=>{const r=recallLP(f.lot,f.amt,f.reason.trim(),actL,sidL);U.lr=null;return r},r=>`${r} 회수를 완료했습니다.`);break}
    case 'lexch':{const f=U.lx;b.disabled=true;act(()=>{const ex=exchange({m:U.sel.lounge,s:sidL,target:f.target,qty:f.qty,by:'점주 대행',actor:actL,confirm:f.ok});ex.consent=f.how;U.lres=ex.no;U.lx=null;return ex});break}
    case 'ldone':U.lres=null;render();break;
    case 'pgrant':{const f=U.pg;b.disabled=true;act(()=>{const r=grantIP(U.sel.partner,sidP,f.amt,f.reason.trim(),actP);U.pg={amt:f.amt,reason:''};return r},r=>`${r} 지급을 완료했습니다.`);break}
    case 'crreq':{const t=b.dataset.t;modal(`<h3>${t} 정정 요청</h3><p style="color:var(--ink2);font-size:14px;margin:0 0 12px">제휴매장은 잔액을 직접 차감할 수 없습니다. 본사가 근거를 확인한 뒤 정정 기록을 추가합니다.</p><div class="field"><label for="crm">요청 내용</label><textarea id="crm" placeholder="예: 40 IP를 4 IP로 입력해야 했습니다."></textarea></div>`,w=>{const memo=w.querySelector('#crm').value.trim();if(!memo){toast('요청 내용을 입력합니다.',true);return false}act(()=>S.cr.push({no:'C'+(++S.seq.cr),tx:t,memo,by:actP,s:sidP,ts:now(),status:'대기'}),'본사에 정정을 요청했습니다.')},'요청 보내기');break}
    case 'crok':{const c=S.cr.find(x=>x.no===b.dataset.c),l=S.ledger.find(x=>x.no===c.tx);
      modal(`<h3>${c.tx} 정정 기록 추가</h3><p style="color:var(--ink2);font-size:14px;margin:0 0 12px">원거래는 그대로 두고 IP 본사 정정 거래를 추가합니다. 회원 현재 잔액 ${fmt(ipOf(l.m))} IP 안에서만 차감합니다.</p><div class="field"><label for="cra">정정 수량 (IP)</label><input id="cra" class="num" inputmode="numeric" value="${l.ip}"></div><div class="field"><label for="crn">승인 사유</label><input id="crn" value="${esc(c.memo)}"></div>`,
      w=>{const amt=Math.floor(Number(w.querySelector('#cra').value)),note=w.querySelector('#crn').value.trim();
        if(!(amt>0)||amt>l.ip){toast('정정 수량은 1 이상, 원지급 수량 이하로 입력합니다.',true);return false}
        if(!note){toast('승인 사유를 입력합니다.',true);return false}
        if(amt>ipOf(l.m)){act(()=>{c.status='보류';c.note=`회원 잔액 ${ipOf(l.m)} IP로 부족. 이미 사용한 포인트는 임의로 차감하지 않습니다.`});return}
        act(()=>{S.ip[l.m]=ipOf(l.m)-amt;const no=addTx({type:'IP_CORRECT',m:l.m,s:l.s,actor:'main_admin',ip:-amt,reason:note,ref:c.tx});c.status='처리 완료';c.note=`${no}로 -${amt} IP 정정`},'정정 기록을 추가했습니다.')},'정정 기록 추가',true);break}
    case 'crno':{const c=S.cr.find(x=>x.no===b.dataset.c);modal(`<h3>${c.no} 반려</h3><div class="field"><label for="crr">반려 사유</label><input id="crr" placeholder="예: 지급 근거 확인됨"></div>`,w=>{const n=w.querySelector('#crr').value.trim();if(!n){toast('반려 사유를 입력합니다.',true);return false}act(()=>{c.status='반려';c.note=n},'반려했습니다.')},'반려');break}
    case 'pf':U.pf=b.dataset.v;render();break;
    case 'fpcheck':{const ex=S.ex.find(x=>x.no===b.dataset.x);act(()=>{ex.tries=(ex.tries||1)+1;ex.lastCheck=now();if(ex.delivered)completeTicket(ex,'FPG-'+pad(Math.floor(Math.random()*90000)+10000,5),'main_admin (풀팟 기록 조회)')},()=>ex.status==='완료'?`풀팟 지급 기록을 찾아 ${ex.no}를 완료 처리했습니다.`:'아직 지급 기록이 없습니다.');break}
    case 'fpfail':{const ex=S.ex.find(x=>x.no===b.dataset.x);modal(`<h3>${ex.no} 지급 실패 처리</h3><p style="color:var(--ink2);font-size:14px;margin:0 0 12px">미지급이 확인된 경우에만 예약한 ${fmt(ex.lp)} LP를 해제합니다. 타임아웃만으로 실패 처리하면 중복 지급이 생길 수 있습니다.</p><div class="field"><label for="ffr">회원에게 보일 실패 사유</label><input id="ffr" value="티켓 지급이 완료되지 않았습니다. 다시 신청해 주세요."></div><label class="check"><input type="checkbox" id="ffc"><span>풀팟 지급 기록에 해당 신청이 없음을 직접 확인했습니다.</span></label>`,
      w=>{if(!w.querySelector('#ffc').checked){toast('미지급 확인에 체크합니다.',true);return false}if(ex.delivered){toast('풀팟 지급 기록에 이 신청이 있습니다. "풀팟에서 확인"으로 완료 처리합니다.',true);return}act(()=>failTicket(ex,w.querySelector('#ffr').value.trim(),'main_admin'),'실패 처리하고 예약을 해제했습니다.')},'실패 처리',true);break}
    case 'psave':{const ip=Math.floor(Number($('#p-ip').value)),tk=Math.floor(Number($('#p-tk').value)),mx=Math.floor(Number($('#p-mx').value));if(!(ip>0&&tk>0&&mx>0)){toast('모든 값은 1 이상 정수로 입력합니다.',true);break}act(()=>S.policy.push({ver:pol().ver+1,lpPerIp:ip,lpPerTicket:tk,maxTickets:mx,from:now(),by:'main_admin'}),()=>`정책 v${pol().ver}를 저장했습니다. 신규 교환부터 적용합니다.`);break}
    case 'limsave':{const s=b.dataset.s,v=Math.floor(Number($('#lim-'+s).value));if(!(v>0)){toast('한도는 1 이상 정수로 입력합니다.',true);break}act(()=>{S.limits[s]=v},`${store(s).name} 한도를 저장했습니다.`);break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.f){const f=U[d.f];if(d.n==='ok')f.ok=t.checked;else if(d.n==='qty'){f.qty=Math.max(1,Math.floor(Number(t.value.replace(/\D/g,'')))||1)}else{f[d.n]=t.value;if(d.n==='target'||d.n==='s')f.qty=1}render();return}
  if(d.g){U.lg[d.g]=t.value;render();return}
  if(d.r){U.lr[d.r]=t.value;if(d.r==='lot')U.lr.amt='';render();return}
  if(d.pg){U.pg[d.pg]=t.value;render();return}
  if(d.lf){U.lf[d.lf]=t.value;render();return}
  if(d.q){U.q=U.q||{};U.q[d.q]=t.value;render();return}
  if(d.rg){U.rg[d.rg]=t.value;return}
  if(d.ac){U.ac[d.ac]=t.value;if(d.ac==='type')render();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fpmode'){S.fp=t.value;save();toast({ok:'모의 풀팟: 바로 지급합니다.',delay:'모의 풀팟: 응답이 늦어 확인 중 상태가 됩니다. 30초 뒤 자동 조회로 완료됩니다.',fail:'모의 풀팟: 지급을 거절합니다. 예약 포인트는 해제됩니다.'}[t.value])}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
  if(t.dataset.enter==='alogin'){e.preventDefault();$('#al-btn').click()}
  else if(t.dataset.q){e.preventDefault();const r=searchMembers(t.value);if(r.length===1){U.sel[t.dataset.q]=r[0].id;U.lx=null;U.lr=null;render()}}
  else if(t.id==='ln'||t.id==='lp'){e.preventDefault();document.querySelector('[data-a=mlogin]').click()}
});

/* auto lookup: delayed tickets resolve after 30s (체험판 30초 주기) */
setInterval(()=>{
  const due=S.ex.filter(e=>e.status==='확인 중'&&e.delivered&&e.autoAt&&now()>e.autoAt);
  if(!due.length)return;
  due.forEach(e=>completeTicket(e,'FPG-'+pad(Math.floor(Math.random()*90000)+10000,5),'자동 조회'));
  save();
  const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&document.querySelector('.modal'))return;
  render();toast(`풀팟 지급 기록을 확인해 ${due.length}건을 완료 처리했습니다.`);
},5000);

/* ---------- sync between pages (same browser) ---------- */
function resync(){const keep=S&&S.ui&&S.ui.view;if(load()){if(keep)S.ui.view=keep;render()}}
window.addEventListener('storage',e=>{if(e.key===KEY)resync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resync()});
if(!load()||!S.ledger)seed();
render();
</script>
</body>
</html>
