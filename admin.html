<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>APS POINT 관리자</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172b46;font:14px/1.5 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:#147a9c;color:#fff;border-radius:9px;padding:10px 14px}
button.alt{background:#e7eef5;color:#16304c}
button.warn{background:#a83b44}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{border:1px solid #d0dce7;border-radius:8px;padding:10px;background:#fff;width:100%}
textarea{min-height:80px}
label{display:block;font-size:12px;font-weight:700;color:#53667d;margin:10px 0 4px}
.app{display:flex;min-height:100vh}
aside{width:220px;background:#132742;color:#fff;flex-shrink:0;padding:22px 12px}
aside h2{margin:2px 12px 26px;font-size:20px}
aside h2 small{color:#9fb4cc;font-weight:400}
aside button{width:100%;text-align:left;background:transparent;margin-bottom:7px}
aside button.active{background:#176e93}
aside a{display:block;color:#9fd0e6;font-size:13px;margin:18px 12px 0;text-decoration:none}
main{width:100%;max-width:1350px;padding:25px 30px}
h1{font-size:25px;margin:0 0 7px}
h3{font-size:17px;margin:0 0 13px}
.muted{color:#708199;font-size:12px}
.card{background:#fff;border:1px solid #dfe6ef;padding:21px;border-radius:14px;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin-top:15px}
.stat{background:#fff;padding:19px;border-radius:13px;border:1px solid #e2e9f1}
.stat strong{display:block;font-size:30px;color:#127995}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row button{flex:0 0 auto}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
td,th{border-bottom:1px solid #e5ebf2;padding:10px;text-align:left;white-space:nowrap}
th{background:#f5f8fb;font-size:12px}
td.num,th.num{text-align:right}
.pill{display:inline-block;background:#e6f4f5;color:#146b7c;border-radius:12px;padding:2px 9px;font-size:12px}
.pill.wait{background:#fff1dd;color:#a26816}
.pill.fail{background:#fceaea;color:#a83b44}
.tabs{display:flex;gap:8px;margin:17px 0;flex-wrap:wrap}
.tabs button{background:#e5ecf4;color:#234}
.tabs button.active{background:#187b9b;color:#fff}
#note{position:sticky;top:8px;z-index:10}
.alert{padding:12px;border-radius:9px;background:#e7f5fb;color:#12627e;margin:10px 0;box-shadow:0 2px 8px #182c4614}
.alert.bad{background:#fff0ed;color:#a83b44}
.login{max-width:420px;margin:9vh auto}
.actions{display:flex;gap:5px}
.actions button{font-size:12px;padding:6px 9px}
.topbar{display:flex;justify-content:flex-end;gap:8px}
footer{font-size:12px;color:#708199;margin-top:25px}
@media(max-width:750px){.app{display:block}aside{width:auto;padding:14px}aside h2{margin:0 0 10px}aside nav{display:flex;gap:6px;overflow:auto}aside button{min-width:max-content;margin:0}aside a{margin:10px 0 0}main{padding:15px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script>
'use strict';
const KEY = 'aps-index-ticket-demo-v1';
const LOGINKEY = 'aps-admin-auth-v2';
const DEFAULT_SETTINGS = { ratio: 40, max: 5, ticket: '풀팟 토너먼트 티켓', code: 'FULPOT-TICKET', opened: true, site: 'APS 포인트 교환', notice: '교환 신청 후 지급 결과를 확인해 주세요.', password: 'admin1234', reference: '2026.10.19' };
// 회원 화면(index.html)의 예시 회원과 같은 값이어야 합니다.
const EXAMPLES = [
  { id: 'U-1024', name: '김서연', phone: '010-2481-1024', ip: 120, fp: 'FP-20481', fpNick: '리버킹' },
  { id: 'U-1025', name: '박도윤', phone: '010-3917-1025', ip: 40, fp: 'FP-30917', fpNick: '도윤포커' },
  { id: 'U-1026', name: '이하은', phone: '010-5530-1026', ip: 0, fp: 'FP-55302', fpNick: '하은' },
  { id: 'U-1027', name: '최민준', phone: '010-7042-1027', ip: 80, fp: '' }
];

/* ───── 데이터 ───── */
const initial = () => ({ users: EXAMPLES.map(x => ({ ...x })), logs: [], requests: [], seq: 1 });
function load() {
  let x;
  try { x = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!x || !Array.isArray(x.users) || !Array.isArray(x.logs)) x = initial();
  // 회원 화면이 먼저 만든 설정에는 비밀번호 등이 없을 수 있으므로 기본값과 합칩니다.
  x.settings = { ...DEFAULT_SETTINGS, ...(x.settings || {}) };
  x.requests ??= [];
  x.imported ??= [];
  x.seq ??= 1;
  x.users.forEach(u => {
    u.status ??= '정상';
    u.memo ??= '';
    u.held ??= 0;
    u.fp ??= '';
    const ex = EXAMPLES.find(e => e.id === u.id);
    if (!u.fpNick && ex && ex.fpNick && u.fp === ex.fp) u.fpNick = ex.fpNick;
  });
  return x;
}
let d = load();
// 회원 화면(다른 탭)에서 생긴 교환 기록을 덮어쓰지 않도록, 저장하기 전에 항상 최신 데이터를 다시 읽습니다.
function reload() { d = load(); }
function persist() { localStorage.setItem(KEY, JSON.stringify(d)); }
function event(type, id, qty, memo) { d.logs.unshift({ no: 'APS-' + String(d.seq++).padStart(5, '0'), type, id, qty, memo, date: dt() }); }

/* ───── 도우미 ───── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const js = s => esc(JSON.stringify(String(s)));   // onclick 속성 안에 넣을 문자열
const nfmt = n => Number(n || 0).toLocaleString('ko-KR');
const dt = () => new Date().toLocaleString('ko-KR');
const digits = s => String(s || '').replace(/\D/g, '');
function user(id) { return d.users.find(u => u.id === id); }
function html(s) { $('#app').innerHTML = s; }
let noteTimer;
function notice(s, b = false) {
  const el = $('#note');
  if (!el) return;
  clearTimeout(noteTimer);
  el.innerHTML = '<div class="alert ' + (b ? 'bad' : '') + '" role="status">' + esc(s) + '</div>';
  noteTimer = setTimeout(() => { if ($('#note')) $('#note').innerHTML = ''; }, b ? 7000 : 4500);
}
function stat(n, t) { return '<div class="stat"><span>' + t + '</span><strong>' + nfmt(n) + '</strong></div>'; }
function wrap(t, desc, content) { return '<h1>' + t + '</h1><div class="muted">' + desc + '</div>' + content; }
function options(v, labels) { return labels.map(t => '<option ' + (t === v ? 'selected' : '') + '>' + t + '</option>').join(''); }
function askInt(text, def) {
  const a = prompt(text, def);
  if (a === null) return null;
  const v = Number(String(a).replace(/,/g, '').trim());
  return Number.isInteger(v) ? v : NaN;
}

/* ───── 로그인 ───── */
let tab = 'tickets', filter = '전체', regTab = 'direct', tq = '', mq = '';
let auth = sessionStorage.getItem(LOGINKEY) === 'yes', bad = 0, lockedUntil = 0, preview = [];

function login(e) {
  e.preventDefault();
  reload();
  const id = $('#aid').value.trim(), pw = $('#pw').value;
  if (Date.now() < lockedUntil) return notice('로그인 오류가 반복되어 ' + Math.ceil((lockedUntil - Date.now()) / 60000) + '분 동안 잠겼습니다.', true);
  if (id === 'main_admin' && pw === d.settings.password) {
    auth = true; sessionStorage.setItem(LOGINKEY, 'yes'); bad = 0; tab = 'tickets'; render();
  } else {
    bad++;
    if (bad >= 5) { lockedUntil = Date.now() + 15 * 60000; bad = 0; }
    notice('로그인 정보를 확인해 주세요.', true);
  }
}
function quick() { auth = true; sessionStorage.setItem(LOGINKEY, 'yes'); tab = 'tickets'; render(); }
function logout() { auth = false; sessionStorage.removeItem(LOGINKEY); render(); }

/* ───── 화면 틀 ───── */
function shell(body) {
  html('<div class="app"><aside><h2>APS POINT<br><small>관리자</small></h2><nav>' +
    [['tickets', '티켓 지급 내역'], ['members', '회원·포인트 목록'], ['register', '포인트 등록'], ['settings', '설정']]
      .map(([k, v]) => '<button class="' + (tab === k ? 'active' : '') + '" onclick="switchTab(\'' + k + '\')">' + v + '</button>').join('') +
    '</nav><a href="index.html" target="_blank" rel="noopener">회원 화면 열기 ↗</a></aside>' +
    '<main><div class="topbar"><button class="alt" onclick="logout()">로그아웃</button></div><div id="note"></div>' + body +
    '<footer>체험판 · 이 브라우저에만 저장됩니다. 실제 풀팟 지급 API·공유 서버·실제 인증은 연결되지 않았습니다.</footer></main></div>');
}
function switchTab(k) { tab = k; render(); }
function render() {
  if (!auth) {
    html('<div class="login card"><h1>APS 관리자 로그인</h1><p class="muted">관리자 계정으로 접속하세요.</p><div id="note"></div>' +
      '<form onsubmit="login(event)"><label for="aid">관리자 아이디</label><input id="aid" value="main_admin" autocomplete="username">' +
      '<label for="pw">비밀번호</label><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">' +
      '<button type="submit">로그인</button> <button type="button" class="alt" onclick="quick()">체험 관리자 자동 로그인</button></form>' +
      '<p class="muted">자동 로그인은 체험 전용이며 실제 인증 절차가 아닙니다.</p></div>');
    return;
  }
  shell(({ tickets, members, register, settings })[tab]());
  if (tab === 'register') showReg(regTab);
}

/* ───── 티켓 지급 내역 ───── */
const STATUSES = ['전체', '체험 지급 완료', '완료', '실패', '확인 필요'];
function pillClass(s) { return s === '확인 필요' ? 'wait' : s === '실패' ? 'fail' : ''; }
function tickets() {
  const q = tq.toLowerCase();
  const rows = d.requests.slice().reverse().filter(r =>
    (filter === '전체' || r.status === filter) &&
    (!q || (JSON.stringify(r) + ' ' + (user(r.id)?.name || '')).toLowerCase().includes(q)));
  const used = d.requests.filter(x => x.status !== '실패');
  return wrap('티켓 지급 내역', '인덱스포인트 교환과 티켓 지급 처리 기록 조회 (체험판은 실제 미지급) · 최신순',
    '<div class="grid">' + stat(d.requests.length, '전체 교환 건수') + stat(used.reduce((a, r) => a + r.qty, 0), '지급 티켓 장수') +
    stat(used.reduce((a, r) => a + r.cost, 0), '사용 IP 합계') + stat(d.requests.filter(x => x.status === '실패').length, '실패·환불') + '</div>' +
    '<div class="tabs">' + STATUSES.map(f => '<button class="' + (filter === f ? 'active' : '') + '" onclick="setFilter(' + js(f) + ')">' + f +
      (f === '전체' ? '' : ' ' + d.requests.filter(r => r.status === f).length) + '</button>').join('') + '</div>' +
    '<div class="card"><form class="row" onsubmit="event.preventDefault();tq=$(\'#ticketSearch\').value.trim();render()">' +
    '<input id="ticketSearch" placeholder="회원·신청번호·풀팟 ID·지급 번호" value="' + esc(tq) + '"><button>검색</button>' +
    (tq ? '<button type="button" class="alt" onclick="tq=\'\';render()">초기화</button>' : '') + '</form>' +
    '<div class="tablewrap"><table><thead><tr><th>신청번호</th><th>신청일시</th><th>회원</th><th>풀팟 ID · 닉네임</th><th class="num">장수</th><th class="num">사용 IP</th><th>상태</th><th>지급 기록</th><th>처리</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.no) + '</td><td>' + esc(r.date) + '</td><td>' + esc(user(r.id)?.name || r.id) + '</td><td>' + esc(r.fp) +
      '<br><small class="muted">' + esc(r.nick || user(r.id)?.fpNick || '') + '</small></td><td class="num">' + nfmt(r.qty) + '</td><td class="num">' + nfmt(r.cost) +
      '</td><td><span class="pill ' + pillClass(r.status) + '">' + esc(r.status) + '</span></td><td><span class="muted">' +
      esc(r.status === '실패' ? '사유: ' + (r.reason || '-') : (r.payNo || '체험 처리 기록')) + '</span></td><td>' +
      (r.status === '실패' ? '<span class="muted">환불됨</span>' : '<div class="actions"><button class="warn" onclick="failTicket(' + js(r.no) + ')">실패 처리·환불</button></div>') +
      '</td></tr>').join('') +
    '</tbody></table></div>' + (rows.length ? '' : '<p class="muted">해당하는 신청이 없습니다.</p>') + '</div>');
}
function setFilter(f) { filter = f; render(); }
function failTicket(no) {
  const reason = prompt('지급 실패로 처리하고 사용한 IP를 회원에게 돌려줍니다.\n실패 사유를 입력하세요.');
  if (!reason || !reason.trim()) return;
  reload();
  const r = d.requests.find(x => x.no === no);
  if (!r) return notice('신청을 찾을 수 없습니다.', true);
  if (r.status === '실패') return notice('이미 실패 처리된 신청입니다.', true);
  r.status = '실패';
  r.reason = reason.trim();
  const u = user(r.id);
  if (u) u.ip += r.cost;
  event('티켓 지급 실패·환불', r.id, r.cost, no + ' / ' + r.reason);
  persist();
  render();
  notice(no + ' 실패 처리 및 ' + nfmt(r.cost) + ' IP 환불을 기록했습니다. (체험판 · 실제 풀팟 처리 없음)');
}

/* ───── 회원·포인트 ───── */
function members() {
  const q = mq.toLowerCase(), qd = digits(mq);
  const rows = d.users.filter(u => !q || (u.id + ' ' + u.name + ' ' + u.phone + ' ' + u.fp + ' ' + (u.fpNick || '')).toLowerCase().includes(q) || (qd.length >= 4 && digits(u.phone).includes(qd)));
  return wrap('회원·포인트 목록', '회원 조회, 정보 수정, 포인트 증감, 이용 중지 및 활동 이력',
    '<div class="grid">' + stat(d.users.length, '총 회원') + stat(d.users.reduce((a, u) => a + u.ip, 0), '보유 IP 합계') +
    stat(d.users.filter(u => u.fp && u.fpNick).length, '풀팟 계정 등록') + stat(d.users.filter(u => u.status === '이용 중지').length, '이용 중지') + '</div>' +
    '<div class="card"><form class="row" onsubmit="event.preventDefault();mq=$(\'#memberQ\').value.trim();render()">' +
    '<input id="memberQ" placeholder="이름·휴대폰·회원번호·풀팟 ID·닉네임" value="' + esc(mq) + '"><button>검색</button>' +
    (mq ? '<button type="button" class="alt" onclick="mq=\'\';render()">초기화</button>' : '') + '</form>' +
    '<div class="tablewrap"><table><thead><tr><th>회원번호</th><th>이름</th><th>연락처</th><th>풀팟 ID · 닉네임</th><th class="num">보유 IP</th><th class="num">대기</th><th class="num">사용 가능</th><th>상태</th><th>관리</th></tr></thead><tbody>' +
    rows.map(u => '<tr><td>' + esc(u.id) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.phone) + '</td><td>' +
      (u.fp ? esc(u.fp) + '<br><small class="muted">' + esc(u.fpNick || '닉네임 없음') + '</small>' : '<span class="muted">미등록</span>') +
      '</td><td class="num">' + nfmt(u.ip) + '</td><td class="num">' + nfmt(u.held) + '</td><td class="num">' + nfmt(u.ip - u.held) +
      '</td><td><span class="pill ' + (u.status === '이용 중지' ? 'fail' : '') + '">' + esc(u.status) + '</span></td><td><div class="actions">' +
      '<button onclick="adjust(' + js(u.id) + ')">포인트</button><button class="alt" onclick="editInfo(' + js(u.id) + ')">정보</button>' +
      '<button class="alt" onclick="toggleStatus(' + js(u.id) + ')">' + (u.status === '정상' ? '이용 중지' : '이용 재개') + '</button>' +
      '<button class="alt" onclick="showLog(' + js(u.id) + ')">이력</button></div></td></tr>').join('') +
    '</tbody></table></div>' + (rows.length ? '' : '<p class="muted">검색 결과가 없습니다.</p>') + '</div>');
}
function adjust(id) {
  const u0 = user(id);
  if (!u0) return;
  const v = askInt(u0.name + ' 회원 포인트 조정 (현재 ' + nfmt(u0.ip) + ' IP)\n지급은 양수, 차감은 음수로 입력하세요.', '');
  if (v === null) return;
  if (!v) return notice('0이 아닌 정수를 입력하세요.', true);
  const reason = prompt('조정 사유를 입력하세요.');
  if (!reason || !reason.trim()) return notice('조정 사유가 필요합니다.', true);
  reload();
  const u = user(id);
  if (!u) return notice('회원을 찾을 수 없습니다.', true);
  if (u.ip + v < u.held) return notice('차감 후 잔액이 처리 대기 IP보다 적어질 수 없습니다. (현재 ' + nfmt(u.ip) + ' IP)', true);
  u.ip += v;
  event('관리자 포인트 조정', id, v, reason.trim());
  persist(); render();
  notice(u.name + ' 회원 ' + (v > 0 ? '+' : '') + nfmt(v) + ' IP 조정했습니다. (잔액 ' + nfmt(u.ip) + ' IP)');
}
function editInfo(id) {
  const u0 = user(id);
  if (!u0) return;
  const name = prompt('이름', u0.name); if (name === null) return;
  const phone = prompt('휴대폰', u0.phone); if (phone === null) return;
  const memo = prompt('메모', u0.memo || ''); if (memo === null) return;
  if (!name.trim() || digits(phone).length < 10) return notice('이름과 올바른 휴대폰 번호를 입력하세요.', true);
  reload();
  const u = user(id);
  if (!u) return notice('회원을 찾을 수 없습니다.', true);
  if (d.users.some(x => x.id !== id && x.name === name.trim() && digits(x.phone) === digits(phone))) return notice('같은 이름·휴대폰의 다른 회원이 있습니다.', true);
  Object.assign(u, { name: name.trim(), phone: phone.trim(), memo: memo.trim() });
  event('회원 정보 수정', id, 0, memo.trim() || '이름·연락처 수정');
  persist(); render(); notice('회원 정보를 저장했습니다.');
}
function toggleStatus(id) {
  reload();
  const u = user(id);
  if (!u) return;
  const next = u.status === '정상' ? '이용 중지' : '정상';
  if (!confirm(u.name + ' 회원을 "' + next + '" 상태로 바꿀까요?' + (next === '이용 중지' ? '\n이용 중지 회원은 티켓을 교환할 수 없습니다.' : ''))) return;
  u.status = next;
  event('회원 상태 변경', id, 0, next);
  persist(); render(); notice(u.name + ' 회원 상태: ' + next);
}
function showLog(id) {
  const u = user(id);
  alert((u ? u.name + ' 회원 이력\n\n' : '') + (d.logs.filter(l => l.id === id).map(l => l.date + '  ' + l.type + '  ' + (l.qty > 0 ? '+' : '') + nfmt(l.qty) + ' IP' + (l.memo ? ' · ' + l.memo : '')).join('\n') || '내역이 없습니다.'));
}

/* ───── 포인트 등록 ───── */
function register() {
  return wrap('포인트 등록', '직접 등록 및 CSV·엑셀 파일 미리보기',
    '<div class="tabs">' + [['direct', '직접 등록'], ['file', '파일 등록']].map(([k, v]) =>
      '<button class="' + (regTab === k ? 'active' : '') + '" onclick="regTab=\'' + k + '\';render()">' + v + '</button>').join('') + '</div><div id="reg"></div>');
}
function showReg(which) {
  const x = $('#reg');
  if (!x) return;
  if (which === 'direct') x.innerHTML = '<div class="card"><h3>회원 직접 등록 · 인덱스 지급</h3><p class="muted">이름과 휴대폰이 같은 회원이 있으면 그 회원에게 지급하고, 없으면 새 회원으로 등록합니다.</p>' +
    '<form onsubmit="direct(event)"><div class="grid"><div><label for="rname">이름</label><input id="rname"></div><div><label for="rphone">휴대폰</label><input id="rphone" type="tel" placeholder="010-0000-0000"></div>' +
    '<div><label for="rid">회원번호 (선택)</label><input id="rid" placeholder="비우면 자동 생성"></div><div><label for="ramount">지급 IP</label><input id="ramount" type="number" min="0" step="1" value="40"></div></div>' +
    '<label for="rreason">지급 사유</label><input id="rreason" placeholder="등록/적립 사유"><button>회원 등록 및 포인트 지급</button></form></div>';
  else x.innerHTML = '<div class="card"><h3>CSV / XLSX 파일 등록</h3><p class="muted">첫 줄에 <b>회원번호, 포인트, 건번호</b> 열이 있어야 합니다. 포인트는 증감값(차감은 음수)이고, 이미 반영한 건번호는 건너뜁니다. 반영 전에 미리보기로 확인합니다.</p>' +
    '<button type="button" class="alt" onclick="sampleCsv()">예시 CSV 받기</button>' +
    '<label for="importfile">파일</label><input id="importfile" type="file" accept=".csv,.xlsx,.xls" onchange="inspectFile()"><div id="preview"></div></div>';
}
function direct(e) {
  e.preventDefault();
  const name = $('#rname').value.trim(), phone = $('#rphone').value.trim(), qty = Number($('#ramount').value), reason = $('#rreason').value.trim();
  let id = $('#rid').value.trim();
  if (!name) return notice('이름을 입력하세요.', true);
  if (digits(phone).length < 10) return notice('휴대폰 번호를 확인하세요.', true);
  if (!Number.isInteger(qty) || qty < 0) return notice('지급 IP는 0 이상의 정수로 입력하세요.', true);
  if (!reason) return notice('지급 사유를 입력하세요.', true);
  reload();
  let u = d.users.find(x => x.name === name && digits(x.phone) === digits(phone)), created = false;
  if (!u) {
    id = id || 'WEB-' + String(Date.now()).slice(-7);
    if (user(id)) return notice('이미 사용 중인 회원번호입니다: ' + id, true);
    u = { id, name, phone, ip: 0, held: 0, fp: '', fpNick: '', status: '정상', memo: '' };
    d.users.push(u);
    created = true;
  } else if (id && id !== u.id) {
    return notice('이미 등록된 회원(' + u.id + ')입니다. 회원번호를 비우거나 ' + u.id + '로 입력하세요.', true);
  }
  u.ip += qty;
  event(created ? '직접 등록 지급' : '직접 지급', u.id, qty, reason);
  persist(); render();
  notice((created ? '새 회원 ' + u.id + ' 등록, ' : u.name + ' 회원에게 ') + nfmt(qty) + ' IP 지급했습니다.');
}
function parseCSV(text) {
  const out = []; let row = [], s = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { if (quoted && text[i + 1] === '"') { s += '"'; i++; } else quoted = !quoted; }
    else if (c === ',' && !quoted) { row.push(s); s = ''; }
    else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(s); if (row.some(x => x.trim())) out.push(row); row = []; s = '';
    } else s += c;
  }
  row.push(s); if (row.some(x => x.trim())) out.push(row);
  return out;
}
function sampleCsv() {
  const csv = '﻿회원번호,포인트,건번호\nU-1024,40,2026-10-001\nU-1025,-10,2026-10-002\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = '포인트등록_예시.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function inspectFile() {
  const f = $('#importfile').files[0];
  $('#preview').innerHTML = '';
  preview = [];
  if (!f) return;
  let rows;
  try {
    if (/\.csv$/i.test(f.name)) rows = parseCSV(await f.text());
    else {
      if (!window.XLSX) return notice('엑셀 파서를 불러오지 못했습니다. CSV 파일을 사용해 주세요.', true);
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    }
  } catch (err) {
    return notice('파일을 읽지 못했습니다: ' + err.message, true);
  }
  rows = rows.filter(r => r.some(c => String(c).trim()));
  if (!rows.length) return notice('빈 파일입니다.', true);
  reload();
  const h = rows.shift().map(x => String(x).trim().replace(/^﻿/, ''));
  const i = h.indexOf('회원번호'), p = h.indexOf('포인트'), n = h.indexOf('건번호');
  if ([i, p, n].some(x => x < 0)) return notice('필수 열(회원번호, 포인트, 건번호)이 없습니다. 첫 줄 제목을 확인하세요.', true);
  if (!rows.length) return notice('제목 줄 아래에 데이터가 없습니다.', true);
  const seen = new Set(), balance = {};
  preview = rows.map((r, j) => {
    const id = String(r[i] ?? '').trim(), raw = String(r[p] ?? '').replace(/,/g, '').trim(), qty = Number(raw), no = String(r[n] ?? '').trim();
    const u = user(id);
    let err = '';
    if (!u) err = '회원번호 없음';
    else if (!raw || !Number.isInteger(qty) || qty === 0) err = '포인트 오류';
    else if (!no) err = '건번호 없음';
    else if (d.imported.includes(no)) err = '이미 반영한 건번호';
    else if (seen.has(no)) err = '파일 안 중복 건번호';
    else {
      const after = (balance[id] ?? u.ip) + qty;
      if (after < u.held || after < 0) err = '차감 후 잔액 부족';
      else balance[id] = after;
    }
    if (no) seen.add(no);
    return { id, name: u?.name || '', qty, no, row: j + 2, err };
  });
  const ok = preview.filter(r => !r.err);
  $('#preview').innerHTML = '<h3 style="margin-top:18px">미리보기 · 반영 ' + ok.length + '건 / 건너뜀 ' + (preview.length - ok.length) + '건 · 합계 ' +
    (ok.reduce((a, r) => a + r.qty, 0) > 0 ? '+' : '') + nfmt(ok.reduce((a, r) => a + r.qty, 0)) + ' IP</h3>' +
    '<div class="tablewrap"><table><thead><tr><th>행</th><th>회원번호</th><th>이름</th><th class="num">포인트</th><th>건번호</th><th>검증</th></tr></thead><tbody>' +
    preview.map(r => '<tr><td>' + r.row + '</td><td>' + esc(r.id) + '</td><td>' + esc(r.name) + '</td><td class="num">' + (Number.isFinite(r.qty) ? nfmt(r.qty) : '-') +
      '</td><td>' + esc(r.no) + '</td><td>' + (r.err ? '<span class="pill fail">' + esc(r.err) + '</span>' : '<span class="pill">반영 가능</span>') + '</td></tr>').join('') +
    '</tbody></table></div><button onclick="applyImport()" ' + (!ok.length ? 'disabled' : '') + '>정상 ' + ok.length + '건 반영</button>';
}
function applyImport() {
  const list = preview.filter(x => !x.err);
  if (!list.length) return;
  if (!confirm(list.length + '건을 반영할까요?')) return;
  reload();
  let count = 0;
  for (const r of list) {
    const u = user(r.id);
    if (!u || d.imported.includes(r.no) || u.ip + r.qty < Math.max(0, u.held)) continue;
    u.ip += r.qty;
    d.imported.push(r.no);
    event('파일 포인트 반영', r.id, r.qty, r.no);
    count++;
  }
  persist();
  preview = [];
  render();
  notice(count + '건 반영했습니다.' + (count < list.length ? ' (' + (list.length - count) + '건은 그사이 상태가 바뀌어 건너뜀)' : ''), count < list.length);
}

/* ───── 설정 ───── */
function settings() {
  const s = d.settings;
  return wrap('설정', '교환 조건, 회원 화면 안내 문구, 관리자 비밀번호 · 저장하면 회원 화면에 바로 반영됩니다',
    '<div class="card"><h3>교환 조건</h3><form onsubmit="saveSettings(event)"><div class="grid"><div><label for="ratio">티켓 1장당 IP</label><input id="ratio" type="number" min="1" step="1" value="' + s.ratio + '"></div>' +
    '<div><label for="max">1회 최대 티켓 장수</label><input id="max" type="number" min="1" step="1" value="' + s.max + '"></div>' +
    '<div><label for="ticket">티켓 이름</label><input id="ticket" value="' + esc(s.ticket) + '"></div><div><label for="code">티켓 코드</label><input id="code" value="' + esc(s.code) + '"></div></div>' +
    '<label for="opened">교환 상태</label><select id="opened">' + options(s.opened ? '열림' : '닫힘', ['열림', '닫힘']) + '</select>' +
    '<h3 style="margin-top:22px">회원 화면 안내</h3><label for="site">사이트 이름</label><input id="site" value="' + esc(s.site) + '">' +
    '<label for="ref">자료 기준 시점</label><input id="ref" value="' + esc(s.reference) + '">' +
    '<label for="snotice">교환 안내 문구</label><textarea id="snotice">' + esc(s.notice) + '</textarea><button>설정 저장</button></form></div>' +
    '<div class="card"><h3>관리자 비밀번호 변경</h3><form onsubmit="changePassword(event)"><label for="oldpw">현재 비밀번호</label><input id="oldpw" type="password" autocomplete="current-password">' +
    '<label for="newpw">새 비밀번호 (8자 이상)</label><input id="newpw" type="password" autocomplete="new-password"><button>비밀번호 변경</button></form>' +
    '<p class="muted">체험판 비밀번호는 이 브라우저에만 저장되며 실제 보안 기능이 아닙니다.</p></div>' +
    '<div class="card"><h3>체험 데이터</h3><p class="muted">회원·내역·설정을 처음 예시 상태로 되돌립니다. 같은 브라우저의 회원 화면도 함께 초기화됩니다.</p><button class="warn" onclick="resetDemo()">예시 데이터로 초기화</button></div>');
}
function saveSettings(e) {
  e.preventDefault();
  const r = Number($('#ratio').value), m = Number($('#max').value);
  if (!Number.isInteger(r) || r <= 0) return notice('티켓 1장당 IP는 1 이상의 정수로 입력하세요.', true);
  if (!Number.isInteger(m) || m <= 0) return notice('1회 최대 티켓 장수는 1 이상의 정수로 입력하세요.', true);
  reload();
  Object.assign(d.settings, {
    ratio: r, max: m,
    ticket: $('#ticket').value.trim() || d.settings.ticket,
    code: $('#code').value.trim() || d.settings.code,
    opened: $('#opened').value === '열림',
    site: $('#site').value.trim() || d.settings.site,
    reference: $('#ref').value.trim(),
    notice: $('#snotice').value.trim()
  });
  persist(); render();
  notice('설정을 저장했습니다. 회원 화면에 바로 반영됩니다.');
}
function changePassword(e) {
  e.preventDefault();
  reload();
  if ($('#oldpw').value !== d.settings.password) return notice('현재 비밀번호가 다릅니다.', true);
  if ($('#newpw').value.length < 8) return notice('새 비밀번호는 8자 이상이어야 합니다.', true);
  d.settings.password = $('#newpw').value;
  persist(); render(); notice('체험 관리자 비밀번호를 변경했습니다.');
}
function resetDemo() {
  if (!confirm('모든 체험 데이터를 지우고 예시 상태로 되돌릴까요?')) return;
  localStorage.removeItem(KEY);
  d = load(); persist();
  tq = ''; mq = ''; filter = '전체'; preview = [];
  render(); notice('예시 데이터로 초기화했습니다. 관리자 비밀번호도 admin1234로 돌아갑니다.');
}

// 회원 화면에서 교환하면 이 화면도 바로 갱신합니다(입력 중이면 입력이 끝난 뒤).
let pending = false;
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'file'; };
window.addEventListener('storage', ev => {
  if (ev.key !== KEY || !auth) return;
  reload();
  if (typing() || preview.length) { pending = true; return; }
  render();
});
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing() && !preview.length) { pending = false; render(); } }, 0));

render();
</script>
