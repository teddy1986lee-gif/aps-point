<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>APS POINT 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b46;font:14px/1.5 system-ui,'Apple SD Gothic Neo',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:#147a9c;color:white;border-radius:9px;padding:10px 14px}button.alt{background:#e7eef5;color:#16304c}button.warn{background:#a83b44}button:disabled{opacity:.4}input,select,textarea{border:1px solid #d0dce7;border-radius:8px;padding:10px;background:white;width:100%}label{display:block;font-size:12px;font-weight:700;color:#53667d;margin:10px 0 4px}.app{display:flex;min-height:100vh}aside{width:220px;background:#132742;color:white;flex-shrink:0;padding:22px 12px}aside h2{margin:2px 12px 26px;font-size:20px}aside button{width:100%;text-align:left;background:transparent;margin-bottom:7px}aside button.active{background:#176e93}main{width:100%;max-width:1350px;padding:25px 30px}h1{font-size:25px;margin:0 0 7px}h3{font-size:17px;margin:0 0 13px}.muted{color:#708199;font-size:12px}.card{background:white;border:1px solid #dfe6ef;padding:21px;border-radius:14px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}.stat{background:#fff;padding:19px;border-radius:13px;border:1px solid #e2e9f1}.stat strong{display:block;font-size:30px;color:#127995}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button,.row .small{flex:0 0 auto}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}td,th{border-bottom:1px solid #e5ebf2;padding:10px;text-align:left;white-space:nowrap}th{background:#f5f8fb;font-size:12px}.pill{display:inline-block;background:#e6f4f5;color:#146b7c;border-radius:12px;padding:2px 9px;font-size:12px}.pill.wait{background:#fff1dd;color:#a26816}.pill.fail{background:#fceaea;color:#a83b44}.tabs{display:flex;gap:8px;margin:17px 0;flex-wrap:wrap}.tabs button{background:#e5ecf4;color:#234}.tabs button.active{background:#187b9b;color:white}.alert{padding:12px;border-radius:9px;background:#e7f5fb;color:#12627e;margin:10px 0}.alert.bad{background:#fff0ed;color:#a83b44}.login{max-width:420px;margin:9vh auto}.mini{max-width:280px}.actions{display:flex;gap:5px}.actions button{font-size:12px;padding:6px 9px}.modalBG{position:fixed;inset:0;background:#0f21348c;display:grid;place-items:center;padding:15px}.modal{background:white;padding:24px;border-radius:13px;width:min(560px,100%);max-height:90vh;overflow:auto}footer{font-size:12px;color:#708199;margin-top:25px}@media(max-width:750px){.app{display:block}aside{width:auto}aside h2{margin:0 0 10px}aside nav{display:flex;overflow:auto}aside button{min-width:max-content}main{padding:15px}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>const KEY='aps-index-ticket-demo-v1',LOGINKEY='aps-admin-auth-v2';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nfmt=n=>Number(n||0).toLocaleString('ko-KR');const dt=()=>new Date().toLocaleString('ko-KR');const initial=()=>({users:[{id:'U-1024',name:'김서연',phone:'010-2481-1024',ip:120,fp:'FP-20481'},{id:'U-1025',name:'박도윤',phone:'010-3917-1025',ip:40,fp:'FP-30917'},{id:'U-1026',name:'이하은',phone:'010-5530-1026',ip:0,fp:'FP-55302'},{id:'U-1027',name:'최민준',phone:'010-7042-1027',ip:80,fp:''}],logs:[],seq:1});let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch{}if(!d||!Array.isArray(d.users)||!Array.isArray(d.logs))d=initial();d.settings??={ratio:40,max:5,ticket:'풀팟 토너먼트 티켓',code:'FULPOT-TICKET',opened:true,site:'APS 포인트 교환',notice:'교환 신청 후 지급 결과를 확인해 주세요.',password:'admin1234',reference:'2026.10.19'};d.requests??=[];d.links??=[];d.imported??=[];d.locks??={};d.users.forEach(u=>{u.status??='정상';u.memo??='';u.held??=0});let tab='tickets',filter='확인 필요',selected='',auth=sessionStorage.getItem(LOGINKEY)==='yes',bad=0,lockedUntil=0,preview=[];function persist(){localStorage.setItem(KEY,JSON.stringify(d))}function event(type,id,qty,memo){d.logs.unshift({no:'APS-'+String(d.seq++).padStart(5,'0'),type,id,qty,memo,date:dt()});persist()}function user(id){return d.users.find(u=>u.id===id)}function html(s){$('#app').innerHTML=s}function notice(s,b=false){$('#note').innerHTML='<div class="alert '+(b?'bad':'')+'">'+esc(s)+'</div>'}function stat(n,t){return '<div class="stat"><span>'+t+'</span><strong>'+nfmt(n)+'</strong></div>'}function wrap(t,desc,content){return '<h1>'+t+'</h1><div class="muted">'+desc+'</div>'+content}function options(v,labels){return labels.map(t=>'<option '+(t===v?'selected':'')+'>'+t+'</option>').join('')}function login(){const id=$('#aid').value,pw=$('#pw').value;if(Date.now()<lockedUntil)return notice('로그인 오류가 반복되어 잠시 잠겼습니다.',true);if(id==='main_admin'&&pw===d.settings.password){auth=true;sessionStorage.setItem(LOGINKEY,'yes');bad=0;tab='tickets';render()}else{bad++;if(bad>=5){lockedUntil=Date.now()+15*60000;bad=0}notice('로그인 정보를 확인해 주세요.',true)}}function quick(){auth=true;sessionStorage.setItem(LOGINKEY,'yes');tab='tickets';render()}function logout(){auth=false;sessionStorage.removeItem(LOGINKEY);render()}function shell(body){html('<div class="app"><aside><h2>APS POINT<br><small>관리자</small></h2><nav>'+[['tickets','티켓 지급'],['accounts','풀팟 계정 관리'],['members','회원·포인트 목록'],['register','포인트 등록'],['settings','설정']].map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="switchTab(\''+k+'\')">'+v+'</button>').join('')+'</nav></aside><main><div style="text-align:right"><button class="alt" onclick="logout()">로그아웃</button></div><div id="note"></div>'+body+'<footer>체험판 · 브라우저 데이터에만 저장됩니다. 실제 풀팟 지급 API·공유 서버·실제 인증은 연결되지 않았습니다.</footer></main></div>')}function switchTab(k){tab=k;selected='';render()}function render(){if(!auth){html('<div class="login card"><h1>APS 관리자 로그인</h1><p class="muted">관리자 계정으로 접속하세요.</p><div id="note"></div><label>관리자 아이디</label><input id="aid" value="main_admin"><label>비밀번호</label><input id="pw" type="password" placeholder="비밀번호"><button onclick="login()">로그인</button> <button class="alt" onclick="quick()">체험 관리자 자동 로그인</button><p class="muted">자동 로그인은 체험 전용이며 실제 인증 절차가 아닙니다.</p></div>');return}shell(({tickets,accounts,members,register,settings})[tab]())}function searchValue(id){return ($('#'+id)?.value||'').toLowerCase().trim()}function tickets(){let rows=d.requests;let q=window.tq||'';rows=rows.filter(r=>(filter==='전체'||r.status===filter)&&(!q||(JSON.stringify(r)+user(r.id)?.name).toLowerCase().includes(q.toLowerCase())));return wrap('티켓 지급','확인 필요 · 완료 · 실패 신청과 지급 기록 확인', '<div class="grid">'+stat(d.requests.filter(x=>x.status==='확인 필요').length,'확인 필요')+stat(d.requests.filter(x=>x.status==='완료').length,'완료')+stat(d.requests.filter(x=>x.status==='실패').length,'실패')+'</div><div class="tabs">'+['확인 필요','완료','실패','전체'].map(f=>'<button class="'+(filter===f?'active':'')+'" onclick="filter=\''+f+'\';render()">'+f+'</button>').join('')+'</div><div class="card"><div class="row"><input id="ticketSearch" placeholder="회원·신청번호·풀팟 ID·지급 번호" value="'+esc(q)+'"><button onclick="window.tq=$(&quot;#ticketSearch&quot;).value;render()">검색</button></div><div class="tablewrap"><table><thead><tr><th>신청번호</th><th>회원</th><th>풀팟 ID</th><th>장수</th><th>사용 IP</th><th>상태</th><th>처리</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.no)+'</td><td>'+esc(user(r.id)?.name||r.id)+'</td><td>'+esc(r.fp)+'</td><td>'+r.qty+'</td><td>'+r.cost+'</td><td><span class="pill '+(r.status==='확인 필요'?'wait':r.status==='실패'?'fail':'')+'">'+r.status+'</span></td><td><div class="actions"><button onclick="ticketAction(\''+r.no+'\')">조회·처리</button></div></td></tr>').join('')+'</tbody></table></div>'+(rows.length?'':'<p class="muted">해당하는 신청이 없습니다.</p>')+'</div>')}function ticketAction(no){let r=d.requests.find(x=>x.no===no);let ans=prompt('처리 선택: 조회 / 재요청 / 완료 / 실패\n풀팟 실제 API 연동은 없으므로 체험 상태만 변경합니다.','조회');if(!ans)return;if(ans==='조회'||ans==='재요청'){notice('체험판: 풀팟 지급 기록 조회 및 실제 재요청 기능은 서버 연동 후 사용할 수 있습니다.');return}if(!['완료','실패'].includes(ans))return notice('지원되지 않는 처리입니다.',true);if(ans==='완료'){let pay=prompt('확인한 풀팟 지급 번호를 입력하세요');if(!pay)return;r.payNo=pay;r.status='완료';let u=user(r.id);if(u){u.held=Math.max(0,(u.held||0)-r.cost);u.ip=Math.max(0,u.ip-r.cost)}event('티켓 지급 완료',r.id,0,no+' / '+pay)}else{let reason=prompt('지급 실패 사유를 입력하세요');if(!reason)return;r.status='실패';r.reason=reason;let u=user(r.id);if(u){u.held=Math.max(0,(u.held||0)-r.cost)}event('티켓 지급 실패',r.id,r.cost,no+' / '+reason)}persist();render();notice('체험판 상태 변경 완료. 실제 풀팟 지급 처리는 수행되지 않았습니다.')}function accounts(){let q=window.aq||'';let rows=d.users.filter(u=>u.fp&&(`${u.name} ${u.id} ${u.fp}`).toLowerCase().includes(q.toLowerCase()));return wrap('풀팟 계정 관리','현재 연결 계정과 해제 이력 조회', '<div class="card"><div class="row"><input id="accountQ" placeholder="회원번호·이름·풀팟 ID" value="'+esc(q)+'"><button onclick="window.aq=$(\'#accountQ\').value;render()">검색</button></div><div class="tablewrap"><table><tr><th>회원번호</th><th>이름</th><th>풀팟 ID</th><th>상태</th><th>처리</th></tr>'+rows.map(u=>'<tr><td>'+u.id+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.fp)+'</td><td>연결됨</td><td><button class="alt" onclick="unlink(\''+u.id+'\')">연결 해제</button></td></tr>').join('')+'</table></div></div><div class="card"><h3>연결·해제 이력</h3><ul>'+d.links.slice().reverse().map(x=>'<li>'+esc(x.date)+' · '+esc(x.name)+' · '+esc(x.fp)+' · '+esc(x.reason)+'</li>').join('')+'</ul></div>')}function unlink(id){let u=user(id),reason=prompt('연결 해제 사유를 입력하세요');if(!reason)return;d.links.push({date:dt(),name:u.name,fp:u.fp,reason:'관리자 해제: '+reason});u.fp='';event('계정 연결 해제',id,0,reason);render()}function members(){let q=window.mq||'';let rows=d.users.filter(u=>(u.id+' '+u.name+' '+u.phone+' '+u.fp).toLowerCase().includes(q.toLowerCase()));return wrap('회원·포인트 목록','회원 조회, 상세 수정, 증감 조정, 사용 중지 및 활동 이력', '<div class="grid">'+stat(d.users.length,'총 회원')+stat(d.users.reduce((a,u)=>a+u.ip,0),'보유 IP 합계')+stat(d.users.reduce((a,u)=>a+(u.held||0),0),'사용 대기 IP')+'</div><div class="card"><div class="row"><input id="memberQ" placeholder="이름·휴대폰·회원번호·풀팟 ID" value="'+esc(q)+'"><button onclick="window.mq=$(\'#memberQ\').value;render()">검색</button></div><div class="tablewrap"><table><tr><th>회원번호</th><th>이름</th><th>연락처</th><th>풀팟 ID</th><th>총 IP</th><th>대기</th><th>사용 가능</th><th>상태</th><th>상세</th></tr>'+rows.map(u=>'<tr><td>'+esc(u.id)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.phone)+'</td><td>'+esc(u.fp)+'</td><td>'+nfmt(u.ip)+'</td><td>'+nfmt(u.held)+'</td><td>'+nfmt(u.ip-u.held)+'</td><td>'+esc(u.status)+'</td><td><button onclick="detail(\''+u.id+'\')">관리</button></td></tr>').join('')+'</table></div></div>')}function detail(id){let u=user(id);let action=prompt('회원 '+u.name+'\n관리 항목: 포인트 / 정보 / 상태 / 이력','포인트');if(!action)return;if(action==='포인트'){let v=Number(prompt('조정 IP (차감은 음수)',0)),reason=prompt('조정 사유');if(!Number.isInteger(v)||!v||!reason)return notice('정수 수량과 사유가 필요합니다.',true);if(u.ip+v<u.held)return notice('사용 대기 잔액 이하로 차감할 수 없습니다.',true);u.ip+=v;event('관리자 포인트 조정',id,v,reason)}else if(action==='정보'){let name=prompt('이름',u.name),phone=prompt('휴대폰',u.phone);if(!name||!phone)return;u.name=name;u.phone=phone;u.memo=prompt('메모',u.memo||'')||'';event('회원 정보 수정',id,0,u.memo)}else if(action==='상태'){u.status=u.status==='정상'?'이용 중지':'정상';event('회원 상태 변경',id,0,u.status)}else if(action==='이력'){alert(d.logs.filter(l=>l.id===id).map(l=>l.date+' '+l.type+' '+l.qty+' IP · '+l.memo).join('\n')||'내역이 없습니다.');return}persist();render();notice('회원 정보가 저장되었습니다.')}function register(){return wrap('포인트 등록','직접 등록 및 CSV·엑셀 파일 미리보기', '<div class="tabs"><button onclick="showReg(\'direct\')">직접 등록</button><button onclick="showReg(\'file\')">파일 등록</button></div><div id="reg"></div>')}function showReg(which){const x=$('#reg');if(which==='direct')x.innerHTML='<div class="card"><h3>회원 직접 등록 · 인덱스 지급</h3><div class="grid"><div><label>이름</label><input id="rname"></div><div><label>휴대폰</label><input id="rphone"></div><div><label>회원번호 (선택)</label><input id="rid"></div><div><label>지급 IP</label><input id="ramount" type="number" min="0" value="40"></div></div><label>지급 사유</label><input id="rreason" placeholder="등록/적립 사유"><button onclick="direct()">회원 등록 및 포인트 지급</button></div>';else x.innerHTML='<div class="card"><h3>CSV / XLSX 파일 등록</h3><p class="muted">필수 열: 회원번호, 포인트, 건번호. 포인트는 증감값입니다. 파일 반영 전 미리보기가 표시됩니다.</p><label>자료 기준 시점</label><input type="date" id="refdate"><label>파일</label><input id="importfile" type="file" accept=".csv,.xlsx,.xls"><button onclick="inspectFile()">미리보기</button><div id="preview"></div></div>'}function direct(){let name=$('#rname').value.trim(),phone=$('#rphone').value.trim(),id=$('#rid').value.trim(),qty=Number($('#ramount').value),reason=$('#rreason').value.trim();if(!name||!phone||!reason||!Number.isInteger(qty)||qty<0)return notice('이름·휴대폰·사유·포인트 수량을 확인하세요.',true);let u=d.users.find(u=>u.name===name&&u.phone===phone);if(!u){id=id||'WEB-'+String(Date.now()).slice(-7);if(user(id))return notice('중복 회원번호입니다.',true);u={id,name,phone,ip:0,held:0,fp:'',status:'정상',memo:''};d.users.push(u)}u.ip+=qty;event('직접 등록 지급',u.id,qty,reason);render();notice('등록과 지급을 저장했습니다.')}function parseCSV(text){let out=[],row=[],s='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){s+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(s);s=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(s);if(row.some(x=>x.trim()))out.push(row);row=[];s=''}else s+=c}row.push(s);if(row.some(x=>x.trim()))out.push(row);return out}async function inspectFile(){const f=$('#importfile').files[0];if(!f)return notice('파일을 선택하세요.',true);let rows;if(/\.csv$/i.test(f.name))rows=parseCSV(await f.text());else{if(!window.XLSX)return notice('엑셀 파서 로딩 실패. CSV 파일을 사용해 주세요.',true);let wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}let h=rows.shift().map(x=>String(x).trim().replace(/^\uFEFF/,''));let i=h.indexOf('회원번호'),p=h.indexOf('포인트'),n=h.indexOf('건번호');if([i,p,n].some(x=>x<0))return notice('필수 열(회원번호, 포인트, 건번호)이 없습니다.',true);preview=rows.map((r,j)=>{let id=String(r[i]).trim(),qty=Number(r[p]),no=String(r[n]).trim(),err=!user(id)?'회원번호 없음':(!Number.isInteger(qty)?'포인트 오류':(!no?'건번호 없음':d.imported.includes(no)?'중복 건번호':''));return{id,qty,no,row:j+2,err}});let ok=preview.filter(r=>!r.err);$('#preview').innerHTML='<h3>미리보기 · 반영 '+ok.length+'건 / 건너뜀 '+(preview.length-ok.length)+'건</h3><div class="tablewrap"><table><tr><th>행</th><th>회원번호</th><th>포인트</th><th>건번호</th><th>검증</th></tr>'+preview.map(r=>'<tr><td>'+r.row+'</td><td>'+esc(r.id)+'</td><td>'+nfmt(r.qty)+'</td><td>'+esc(r.no)+'</td><td>'+esc(r.err||'반영 가능')+'</td></tr>').join('')+'</table></div><button onclick="applyImport()" '+(!ok.length?'disabled':'')+'>정상 '+ok.length+'건 반영</button>'}function applyImport(){let count=0;for(let r of preview.filter(x=>!x.err)){let u=user(r.id);if(!u||u.ip+r.qty<u.held)continue;u.ip+=r.qty;d.imported.push(r.no);event('파일 포인트 반영',r.id,r.qty,r.no);count++}preview=[];render();notice(count+'건 정상 반영했습니다.')}function settings(){const s=d.settings;return wrap('설정','교환 조건, 사이트 문구, 관리자 비밀번호 관리', '<div class="card"><h3>교환 조건</h3><div class="grid"><div><label>티켓 1장당 IP</label><input id="ratio" type="number" min="1" value="'+s.ratio+'"></div><div><label>1회 최대 티켓 장수</label><input id="max" type="number" min="1" value="'+s.max+'"></div><div><label>티켓 이름</label><input id="ticket" value="'+esc(s.ticket)+'"></div><div><label>티켓 코드</label><input id="code" value="'+esc(s.code)+'"></div></div><label>교환 상태</label><select id="opened">'+options(s.opened?'열림':'닫힘',['열림','닫힘'])+'</select><button onclick="saveSettings()">설정 저장</button></div><div class="card"><h3>사이트 안내</h3><label>사이트 이름</label><input id="site" value="'+esc(s.site)+'"><label>자료 기준 시점</label><input id="ref" value="'+esc(s.reference)+'"><label>지급 안내 문구</label><textarea id="snotice">'+esc(s.notice)+'</textarea><button onclick="saveSettings()">안내 저장</button></div><div class="card"><h3>관리자 비밀번호 변경</h3><label>현재 비밀번호</label><input id="oldpw" type="password"><label>새 비밀번호</label><input id="newpw" type="password"><button onclick="changePassword()">비밀번호 변경</button></div>')}function saveSettings(){let s=d.settings,r=Number($('#ratio')?.value||s.ratio),m=Number($('#max')?.value||s.max);if(!Number.isInteger(r)||r<=0||!Number.isInteger(m)||m<=0)return notice('올바른 교환 비율을 입력하세요.',true);Object.assign(s,{ratio:r,max:m,ticket:$('#ticket')?.value||s.ticket,code:$('#code')?.value||s.code,opened:($('#opened')?.value||'열림')==='열림',site:$('#site')?.value||s.site,reference:$('#ref')?.value||s.reference,notice:$('#snotice')?.value||s.notice});persist();notice('설정이 저장되었습니다. 체험판 회원 화면의 교환 비율은 별도 코드로 고정되어 있으므로 운영 연동 시 통합 적용이 필요합니다.')}function changePassword(){if($('#oldpw').value!==d.settings.password)return notice('현재 비밀번호가 다릅니다.',true);if($('#newpw').value.length<8)return notice('새 비밀번호는 8자 이상이어야 합니다.',true);d.settings.password=$('#newpw').value;persist();notice('체험 관리자 비밀번호가 변경되었습니다.')}render();</script></body></html>
