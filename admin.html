<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>APS 인덱스 · 티켓 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font:15px/1.6 system-ui,'Apple SD Gothic Neo',sans-serif}header{background:#10233d;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:22px}header a{color:#d6e8ff;text-decoration:none}.wrap{max-width:980px;margin:34px auto;padding:0 18px}.hero{background:linear-gradient(115deg,#102c48,#146a85);color:#fff;padding:32px;border-radius:20px;margin-bottom:20px}.hero h1{margin:4px 0;font-size:29px}.hero p{opacity:.8;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:white;border:1px solid #e1e8f0;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 4px 14px #182c4610}.metric{font-size:36px;font-weight:800;margin:8px 0;color:#0a7186}.muted{color:#64748b;font-size:13px}h2{font-size:19px;margin:0 0 15px}label{display:block;margin:12px 0 5px;font-weight:600}input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;background:white}button{cursor:pointer;border:0;border-radius:10px;background:#0d748b;color:white;font:inherit;font-weight:700;padding:12px 20px;margin-top:12px}button.secondary{background:#e7eff6;color:#17243b}button:disabled{opacity:.45;cursor:not-allowed}.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.flex>*{flex:1}.alert{padding:12px;background:#e8f4fa;border-radius:10px;color:#14576b;margin:14px 0}.error{background:#fff0ed;color:#ac342c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{margin:0}.tabs button.off{background:#e7edf5;color:#22364f}.list{padding:0;margin:0;list-style:none}.list li{border-bottom:1px solid #e5ebf2;padding:12px 0}.pill{display:inline-block;padding:3px 8px;background:#eef3f7;border-radius:20px;font-size:12px}small{color:#6e8296}footer{text-align:center;color:#8190a0;margin:35px 0;font-size:12px}@media(max-width:600px){.hero{padding:23px}.hero h1{font-size:23px}}</style></head><body><header><b>APS <span style="color:#55cad2">POINT</span></b><a href="index.html">회원 페이지 →</a></header><main class="wrap"><div id="msg"></div><div id="app"></div><footer>APS 포인트 체험판 · 브라우저별 데이터 저장 · 실제 티켓 지급 기능 없음</footer></main><script>const KEY='aps-index-ticket-demo-v1',RATE=40;const examples=[{id:'U-1024',name:'김서연',phone:'010-2481-1024',ip:120,fp:'FP-20481'},{id:'U-1025',name:'박도윤',phone:'010-3917-1025',ip:40,fp:'FP-30917'},{id:'U-1026',name:'이하은',phone:'010-5530-1026',ip:0,fp:'FP-55302'},{id:'U-1027',name:'최민준',phone:'010-7042-1027',ip:80,fp:''}];function initial(){return{users:examples.map(x=>({...x})),logs:[],seq:1}}function read(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.users)&&Array.isArray(d.logs))return d}catch{}return initial()}let db=read();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('ko-KR');function save(){localStorage.setItem(KEY,JSON.stringify(db))}function log(type,id,qty,memo){db.logs.unshift({no:'APS-'+String(db.seq++).padStart(5,'0'),type,id,qty,memo,date:new Date().toLocaleString('ko-KR')});save()}function msg(t,bad=false){document.getElementById('msg').innerHTML='<div class="alert '+(bad?'error':'')+'">'+esc(t)+'</div>'}function user(id){return db.users.find(x=>x.id===id)}function recent(id){return db.logs.filter(x=>!id||x.id===id).slice(0,30).map(l=>'<li><b>'+esc(l.type)+'</b> · '+esc(user(l.id)?.name||l.id)+' <span class="pill">'+(l.qty>0?'+':'')+fmt(l.qty)+' IP</span><div class="muted">'+esc(l.date)+' · '+esc(l.memo)+' · '+esc(l.no)+'</div></li>').join('')||'<li class="muted">내역이 없습니다.</li>'}
let authorized=sessionStorage.getItem('aps-admin')==='yes';function view(){const el=document.getElementById('app');if(!authorized){el.innerHTML='<div class="card"><h2>체험 관리자 로그인</h2><label>아이디</label><input id="aid" value="main_admin"><label>비밀번호</label><input id="pw" type="password" placeholder="체험 비밀번호"><button onclick="login()">로그인</button><button class="secondary" onclick="quickLogin()">체험 관리자 자동 로그인</button><div class="muted">브라우저 체험용 계정이며 실제 인증 보안이 적용되지 않습니다.</div></div>';return}let total=db.users.reduce((a,u)=>a+u.ip,0),tk=db.logs.filter(l=>l.type==='티켓 교환 신청').length;el.innerHTML='<div class="hero"><h1>인덱스 · 티켓 통합 관리</h1><p>인덱스포인트 지급 및 회원별 티켓 교환 신청 확인</p></div><div class="grid"><div class="card"><div>총 인덱스 잔액</div><div class="metric">'+fmt(total)+' IP</div></div><div class="card"><div>티켓 교환 신청</div><div class="metric">'+fmt(tk)+' 건</div></div></div><div class="card"><h2>인덱스포인트 지급</h2><label>대상 회원</label><select id="uid">'+db.users.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+' ('+esc(m.id)+') · '+fmt(m.ip)+' IP</option>').join('')+'</select><label>지급 수량 (IP)</label><input id="amount" type="number" min="1" value="40"><label>지급 사유</label><input id="reason" placeholder="예: 제휴 매장 적립"><button onclick="grant()">인덱스 지급</button><div class="muted">체험판에서는 지급만 가능합니다. 회수 기능은 제공하지 않습니다.</div></div><div class="card"><h2>회원별 잔액</h2><ul class="list">'+db.users.map(u=>'<li><b>'+esc(u.name)+'</b> <span class="pill">'+fmt(u.ip)+' IP</span><div class="muted">'+esc(u.fp||'풀팟 ID 미연결')+'</div></li>').join('')+'</ul></div><div class="card"><h2>포인트 · 티켓 거래 내역</h2><ul class="list">'+recent(null)+'</ul></div><button class="secondary" onclick="logout()">관리자 로그아웃</button>'}function login(){if(document.getElementById('aid').value==='main_admin'&&document.getElementById('pw').value==='admin1234'){authorized=true;sessionStorage.setItem('aps-admin','yes');msg('관리자 로그인 완료');view()}else msg('관리자 계정을 확인하세요.',true)}function quickLogin(){authorized=true;sessionStorage.setItem('aps-admin','yes');msg('체험 관리자 자동 로그인 완료');view()}function logout(){authorized=false;sessionStorage.removeItem('aps-admin');view()}function grant(){const id=document.getElementById('uid').value,n=Number(document.getElementById('amount').value),reason=document.getElementById('reason').value.trim();if(!Number.isInteger(n)||n<1||n>1000000){msg('1~1,000,000 IP 사이의 수량을 입력하세요.',true);return}if(!reason){msg('지급 사유를 입력하세요.',true);return}user(id).ip+=n;log('인덱스 지급',id,n,reason);msg('인덱스포인트 지급 완료');view()}view()</script></body></html>
